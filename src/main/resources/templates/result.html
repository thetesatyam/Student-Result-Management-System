<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Semester Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        VIT Semester Result
    </h2>

    <table class="table table-bordered">

        <tr>
            <th>Student Name</th>
            <td th:text="${student.studentName}"></td>
        </tr>

        <tr>
            <th>Roll Number</th>
            <td th:text="${student.rollNo}"></td>
        </tr>

    </table>

    <h4>Subject Wise Marks</h4>

    <table class="table table-striped table-bordered">

        <thead>
        <tr>
            <th>Subject</th>
            <th>MSE (30)</th>
            <th>ESE (70)</th>
            <th>Total (100)</th>
        </tr>
        </thead>

        <tbody>

        <tr>
            <td th:text="${student.subject1}"></td>
            <td th:text="${student.mse1}"></td>
            <td th:text="${student.ese1}"></td>
            <td th:text="${total1}"></td>
        </tr>

        <tr>
            <td th:text="${student.subject2}"></td>
            <td th:text="${student.mse2}"></td>
            <td th:text="${student.ese2}"></td>
            <td th:text="${total2}"></td>
        </tr>

        <tr>
            <td th:text="${student.subject3}"></td>
            <td th:text="${student.mse3}"></td>
            <td th:text="${student.ese3}"></td>
            <td th:text="${total3}"></td>
        </tr>

        <tr>
            <td th:text="${student.subject4}"></td>
            <td th:text="${student.mse4}"></td>
            <td th:text="${student.ese4}"></td>
            <td th:text="${total4}"></td>
        </tr>

        </tbody>

    </table>

    <table class="table table-bordered">

        <tr>
            <th>Grand Total</th>
            <td th:text="${grandTotal}"></td>
        </tr>

        <tr>
            <th>Percentage</th>
            <td th:text="${percentage}"></td>
        </tr>

        <tr>
            <th>Grade</th>
            <td th:text="${grade}"></td>
        </tr>

        <tr>
            <th>Result</th>
            <td th:text="${grade=='FAIL' ? 'FAIL' : 'PASS'}"></td>
        </tr>

    </table>

    <a href="/" class="btn btn-primary">
        Back
    </a>

</div>

</body>
</html>
