<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>VIT Semester Result System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        VIT Semester Result System
    </h2>

    <form th:action="@{/result}" method="post">

        <input type="text"
               name="studentName"
               class="form-control mb-3"
               placeholder="Student Name">

        <input type="text"
               name="rollNo"
               class="form-control mb-3"
               placeholder="Roll Number">

        <h4>Subject 1</h4>
        <input type="text" name="subject1" class="form-control mb-2" placeholder="Subject Name">
        <input type="number" name="mse1" class="form-control mb-2" placeholder="MSE Marks">
        <input type="number" name="ese1" class="form-control mb-3" placeholder="ESE Marks">

        <h4>Subject 2</h4>
        <input type="text" name="subject2" class="form-control mb-2" placeholder="Subject Name">
        <input type="number" name="mse2" class="form-control mb-2" placeholder="MSE Marks">
        <input type="number" name="ese2" class="form-control mb-3" placeholder="ESE Marks">

        <h4>Subject 3</h4>
        <input type="text" name="subject3" class="form-control mb-2" placeholder="Subject Name">
        <input type="number" name="mse3" class="form-control mb-2" placeholder="MSE Marks">
        <input type="number" name="ese3" class="form-control mb-3" placeholder="ESE Marks">

        <h4>Subject 4</h4>
        <input type="text" name="subject4" class="form-control mb-2" placeholder="Subject Name">
        <input type="number" name="mse4" class="form-control mb-2" placeholder="MSE Marks">
        <input type="number" name="ese4" class="form-control mb-3" placeholder="ESE Marks">

        <button class="btn btn-primary">
            Generate Result
        </button>

    </form>

</div>

</body>
</html>
